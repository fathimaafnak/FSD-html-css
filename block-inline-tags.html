<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block and inline tags</title>
</head>
<body>
    <div>
        <table border="1">
    <tr>
        <th>Block-level Elements</th>
        <th>Inline Elements</th>
    </tr>
    <tr>
        <td>&lt;div&gt;</td>
        <td>&lt;a&gt;</td>
    </tr>
    <tr>
        <td>&lt;p&gt;</td>
        <td>&lt;span&gt;</td>
    </tr>
    <tr>
        <td>&lt;h1&gt; to &lt;h6&gt;</td>
        <td>&lt;img&gt;</td>
    </tr>
    <tr>
        <td>&lt;ul&gt; / &lt;ol&gt; / &lt;li&gt;</td>
        <td>&lt;button&gt;</td>
    </tr>
    <tr>
        <td>&lt;header&gt;</td>
        <td>&lt;input&gt;</td>
    </tr>
    <tr>
        <td>&lt;footer&gt;</td>
        <td>&lt;textarea&gt;</td>
    </tr>
    <tr>
        <td>&lt;main&gt;</td>
        <td>&lt;select&gt;</td>
    </tr>
    <tr>
        <td>&lt;section&gt;</td>
        <td>&lt;strong&gt;</td>
    </tr>
    <tr>
        <td>&lt;form&gt;</td>
        <td>&lt;em&gt;</td>
    </tr>
    <tr>
        <td>&lt;table&gt;</td>
        <td>&lt;br&gt;</td>
    </tr>
</table>
    </div>
</body>
</html>
